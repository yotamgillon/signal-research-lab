name: ci

# CI runs the code on SYNTHETIC data only. The real data is private and not in the repo,
# so CI cannot run `make run` and cannot show that the real results reproduce.
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q
      - run: make smoke PY=python
